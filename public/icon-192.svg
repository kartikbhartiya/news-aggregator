<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect x="6" y="6" width="180" height="180" rx="42" fill="#09090B" stroke="#27272A" stroke-width="3" />
  
  <!-- Optical Triangular Glass Prism Base -->
  <polygon
    points="96,36 156,146 36,146"
    stroke="#FFFFFF"
    stroke-width="8"
    stroke-linejoin="round"
    fill="rgba(255, 255, 255, 0.12)"
  />

  <!-- Internal Optical Refraction Facet -->
  <line
    x1="96"
    y1="36"
    x2="104"
    y2="146"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-dasharray="6 8"
    stroke-opacity="0.6"
  />

  <!-- Incident Light Beam -->
  <line
    x1="20"
    y1="110"
    x2="66"
    y2="91"
    stroke="#FFFFFF"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Emerging Refracted Light Rays -->
  <line
    x1="126"
    y1="91"
    x2="172"
    y2="70"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    stroke-opacity="0.95"
  />
  <line
    x1="130"
    y1="102"
    x2="172"
    y2="98"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    stroke-opacity="0.8"
  />
  <line
    x1="136"
    y1="112"
    x2="170"
    y2="126"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    stroke-opacity="0.65"
  />
</svg>
