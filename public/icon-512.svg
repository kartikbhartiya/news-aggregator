<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#09090B" stroke="#27272A" stroke-width="8" />
  
  <!-- Optical Triangular Glass Prism Base -->
  <polygon
    points="256,96 416,390 96,390"
    stroke="#FFFFFF"
    stroke-width="20"
    stroke-linejoin="round"
    fill="rgba(255, 255, 255, 0.12)"
  />

  <!-- Internal Optical Refraction Facet -->
  <line
    x1="256"
    y1="96"
    x2="276"
    y2="390"
    stroke="#FFFFFF"
    stroke-width="12"
    stroke-dasharray="16 20"
    stroke-opacity="0.6"
  />

  <!-- Incident Light Beam -->
  <line
    x1="52"
    y1="294"
    x2="176"
    y2="242"
    stroke="#FFFFFF"
    stroke-width="20"
    stroke-linecap="round"
  />

  <!-- Emerging Refracted Light Rays -->
  <line
    x1="336"
    y1="242"
    x2="460"
    y2="188"
    stroke="#FFFFFF"
    stroke-width="16"
    stroke-linecap="round"
    stroke-opacity="0.95"
  />
  <line
    x1="346"
    y1="272"
    x2="460"
    y2="262"
    stroke="#FFFFFF"
    stroke-width="16"
    stroke-linecap="round"
    stroke-opacity="0.8"
  />
  <line
    x1="362"
    y1="300"
    x2="454"
    y2="338"
    stroke="#FFFFFF"
    stroke-width="16"
    stroke-linecap="round"
    stroke-opacity="0.65"
  />
</svg>
