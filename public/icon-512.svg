<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Glass Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.25" />
    </linearGradient>

    <!-- Prism Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Luminous Core Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#10B981" opacity="0.18" filter="url(#glow)" />

  <!-- Geometric Layered Liquid Glass Prism -->
  <g transform="translate(256, 256)">
    <!-- Outer Glass Hexagon / Diamond -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="none" stroke="url(#rimGrad)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Inner Radiant Core -->
    <polygon points="0,-85 73,-42 73,42 0,85 -73,42 -73,-42" fill="url(#coreGrad)" filter="url(#glow)" opacity="0.95" />

    <!-- Specular Highlight Top Facet -->
    <polygon points="0,-85 73,-42 0,0 -73,-42" fill="#FFFFFF" opacity="0.4" />
  </g>
</svg>
